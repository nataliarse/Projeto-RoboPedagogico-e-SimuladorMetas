# nginx do container "web": serve a interface e encaminha a API ao container "api" do mesmo pod.
# O Ingress do cluster entrega as requisições de app.dataiesb.com/robo-orientador com o prefixo.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # redirecionamentos relativos: atrás do Ingress, o host e a porta são os do cliente
    absolute_redirect off;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 64k;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location = /robo-orientador { return 301 /robo-orientador/; }

    # mesmas regras do proxy do Angular (frontend/proxy.conf.json), com o prefixo do app
    location = /robo-orientador/api/processos/health {
        proxy_pass http://127.0.0.1:8000/api/health;
    }
    location /robo-orientador/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /robo-orientador/ {
        try_files $uri $uri/ /robo-orientador/index.html;
    }
}
