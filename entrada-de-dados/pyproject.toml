[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trt18-collector"
version = "1.1.0"
description = "Coletor e normalizador de processos do TRT18"
requires-python = ">=3.10"
dependencies = ["pydantic>=2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["trt18_collector*"]
